name: RS Screener

on:
  workflow_dispatch:        # manueller Trigger zum Testen
  schedule:
    - cron: "0 6 * * *"     # täglich 6:00 UTC – anpassen nach Bedarf

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run RS Screener
        run: |
          python -m pip install -r requirements.txt
          python relative-strength.py true false

      - name: Commit output
        run: |
          git config user.name "CI"
          git config user.email "ci@github.com"
          git add output/*.csv
          git commit -m "RS update $(date -u +%F)" || echo "nothing to commit"
          git push
